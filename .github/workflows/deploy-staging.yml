name: Deploy staging

# Re-deploy (or deploy an older/newer) release tag to STAGING by hand. Tag pushes deploy to staging automatically through release.yml.
# After a deployment, run the soak test plan (docs/runbooks/staging-soak-test.md) before promoting to production.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.3 or v1.2.3-rc.1)
        required: true
        type: string
      migrate:
        description: Run the migrator before starting the new version
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      tag: ${{ inputs.tag }}
      migrate: ${{ inputs.migrate }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
