# Local development stack: SQL Server -> migrator (schema, guards, seed, least-privilege app login) -> API + Blazor portal.
# Secrets come from deploy/docker/.env (copy .env.example; never commit .env).
#   docker compose -f deploy/docker/docker-compose.dev.yml --env-file deploy/docker/.env up --build
# Optional observability (OpenTelemetry collector + Prometheus + Grafana):  add  --profile observability  and set TELEMETRY_ENABLED=true in .env
# Development mode uses throw-away signing/master keys: MFA secrets and ledger anchors do not survive a restart. Not for real data.
name: nexaverify-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in deploy/docker/.env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # sqlservr carries file capability cap_net_bind_service; exec fails without it
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs as the DATABASE ADMIN (sa here; a dedicated deployment login in real environments). It is the only
  # component that changes the schema, installs RLS / append-only guards, seeds identity data and creates the app login.
  migrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.migrator
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=NexaVerify;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Seed__SuperAdminEmail: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in deploy/docker/.env}
      Seed__SuperAdminPassword: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in deploy/docker/.env}
      Migrator__AppLogin: nexaverify_app
      Migrator__AppPassword: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/docker/.env}
    entrypoint: ["/bin/sh", "-c", "dotnet NexaVerify.Migrator.dll migrate && dotnet NexaVerify.Migrator.dll app-principal"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      # Development only: ephemeral signing/master keys and logged email bodies. Production supplies real keys via a secret store.
      ASPNETCORE_ENVIRONMENT: Development
      Telemetry__Enabled: ${TELEMETRY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # The API connects as the least-privilege login created by the migrator (no DDL, cannot alter the RLS policy).
      ConnectionStrings__Default: "Server=sqlserver;Database=NexaVerify;User Id=nexaverify_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      # The runtime image has no curl/wget; bash's /dev/tcp is enough for a liveness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: "http://api:8080"
      Telemetry__Enabled: ${TELEMETRY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- optional observability (profile "observability") ---
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  sqldata:
