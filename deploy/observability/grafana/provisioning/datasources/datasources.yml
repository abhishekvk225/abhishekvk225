apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Optional: point at your Loki to light up the log-based panels (ledger integrity, background jobs, webhooks).
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
